syntax = "proto3";
option go_package = "./pb";

package pb;

message GetUserInfoReq {
  int64 id = 1;
}

message GetUserInfoResp {
  int64 id = 1;
  string nickname = 2;
}

message CreateNewUserReq {
  string username = 1;
  string password = 2;
  string mobile = 3;
}

message CommonResp {
  int64 code = 1;
  string message = 2;
}

//service
service usercenter{
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp);
  rpc CreateNewUser(CreateNewUserReq) returns (CommonResp);
}